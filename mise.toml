min_version = "2026.11.3"

[tools]
hk = { version = "2.11.1", workflow = "release.yml" }
node = "22.23.4"
pnpm = "12.18.0"

[env]
# hk и git-хуки запускают eslint/prettier из локальных зависимостей проекта.
_.path = ["./node_modules/.bin"]

[tasks.setup]
# Браузер для Playwright нужен mise run check — браузерный e2e входит в общий прогон.
run = ["mise install", "pnpm install", "hk install", "pnpm --filter @repo/e2e exec playwright install chromium"]

[tasks.check]
# Единственная команда всех проверок: формат, линтер, типы, тесты, сборка,
# генерация контракта и SDK, проверка свежести и браузерный e2e (AGENTS.md).
run = "pnpm check"

[tasks.generate]
# Одна команда: TypeSpec → openapi.json → SDK (ADR-0002).
run = "pnpm generate"

[tasks.pre-commit]
run = "hk run pre-commit"
