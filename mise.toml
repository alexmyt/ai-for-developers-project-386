min_version = "2026.11.3"

[tools]
hk = { version = "2.11.1", workflow = "release.yml" }
node = "22.23.4"
pnpm = "12.18.0"

[env]
# hk и git-хуки запускают eslint/prettier из локальных зависимостей проекта.
_.path = ["./node_modules/.bin"]

[tasks.setup]
run = ["mise install", "pnpm install", "hk install"]

[tasks.pre-commit]
run = "hk run pre-commit"
